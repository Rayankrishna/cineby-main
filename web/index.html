<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href`. Must start and
    end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reelix — browse trending movies, series and anime, keep a watchlist and pick up where you left off.">
  <meta name="theme-color" content="#18181A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Reelix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Reelix</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #18181A; }
    /* Shown until Flutter paints its first frame (the engine + app are a few MB). */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease;
    }
    #loading img { width: 72px; height: 72px; border-radius: 18px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.94); } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="Reelix"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
